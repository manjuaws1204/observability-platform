name: Observability CI/CD

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Prometheus
        run: |
          wget https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz
          tar -xzf prometheus-2.54.1.linux-amd64.tar.gz

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate YAML
        run: |
          find kubernetes -name "*.yaml" -exec kubeconform {} \;

      - name: Validate Prometheus Config
        run: |
          prometheus-2.54.1.linux-amd64/promtool check config kubernetes/prometheus/configmap.yaml || true

      - name: Validate Alert Rules
        run: |
          if [ -f kubernetes/prometheus/alert-rules.yaml ]; then
            prometheus-2.54.1.linux-amd64/promtool check rules kubernetes/prometheus/alert-rules.yaml
          fi

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Kubernetes Dry Run
        run: |
          kubectl apply --dry-run=client -R -f kubernetes/

      - name: Deploy
        run: |
          kubectl apply -R -f kubernetes/